name: paper-journal

services:
  migrate:
    image: ${IMAGE_NAME:-paper-journal}:${IMAGE_TAG:-latest}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?Set NUXT_DATABASE_URL in .env}
    restart: "no"

  app:
    image: ${IMAGE_NAME:-paper-journal}:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?Set NUXT_DATABASE_URL in .env}
      NUXT_S3_ENDPOINT: ${NUXT_S3_ENDPOINT:-}
      NUXT_S3_REGION: ${NUXT_S3_REGION:-auto}
      NUXT_S3_BUCKET: ${NUXT_S3_BUCKET:-}
      NUXT_S3_ACCESS_KEY_ID: ${NUXT_S3_ACCESS_KEY_ID:-}
      NUXT_S3_SECRET_ACCESS_KEY: ${NUXT_S3_SECRET_ACCESS_KEY:-}
      NUXT_S3_PUBLIC_BASE_URL: ${NUXT_S3_PUBLIC_BASE_URL:-}
    ports:
      - "${HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
